<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario Interno — Pinturas Autos Torres</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --mg:#B5006A;--mg2:#D4007A;--mg3:#F7E0EE;
  --black:#0D0D0D;--white:#fff;--gray:#F3F3F3;--dg:#666;
  --head:'Unbounded',sans-serif;--body:'Inter',sans-serif;
}
body{font-family:var(--body);background:#FAFAFA;color:var(--black);min-height:100vh}
.top{background:var(--mg);padding:.85rem 1.5rem;display:flex;align-items:center;gap:1rem;
  border-bottom:3px solid var(--black);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top-logo{font-family:var(--head);font-size:10px;font-weight:900;color:var(--white);letter-spacing:-0.01em;flex:1;min-width:0}
.top-logo b{background:var(--white);color:var(--mg);padding:2px 7px;margin-right:5px}
.top-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top-badge{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);
  color:var(--white);font-size:11px;padding:4px 10px;border-radius:20px;white-space:nowrap}
.autosave{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,0.85)}
.autosave-dot{width:8px;height:8px;border-radius:50%;background:#4CAF50;flex-shrink:0;
  box-shadow:0 0 6px rgba(76,175,80,0.8);transition:background .3s}
.autosave-dot.saving{background:#FFB300;animation:pulse .6s infinite alternate}
.autosave-dot.offline{background:#FFB300;box-shadow:0 0 6px rgba(255,179,0,0.8)}
@keyframes pulse{from{opacity:1}to{opacity:.3}}
.filtros{background:var(--white);border-bottom:2px solid var(--black);
  padding:1rem 1.5rem;display:flex;flex-wrap:wrap;gap:.75rem;align-items:flex-end}
.f-group{display:flex;flex-direction:column;gap:4px;min-width:160px}
.f-group label{font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;color:var(--dg)}
select,input[type=text]{
  font-family:var(--body);font-size:13px;
  border:1.5px solid #ddd;border-radius:6px;padding:8px 10px;
  background:var(--white);color:var(--black);outline:none;transition:border-color .15s;
}
select:focus,input[type=text]:focus{border-color:var(--mg)}
.f-actions{display:flex;gap:8px;align-items:flex-end;margin-left:auto}
.btn{font-family:var(--head);font-size:9px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:9px 16px;border-radius:5px;border:none;
  cursor:pointer;transition:background .15s}
.btn-out{background:var(--white);color:var(--black);border:2px solid #ddd}
.btn-out:hover{border-color:var(--mg);color:var(--mg)}
.stats-bar{padding:.6rem 1.5rem;background:var(--gray);border-bottom:1px solid #e0e0e0;
  display:flex;gap:1.5rem;font-size:12px;color:var(--dg);flex-wrap:wrap}
.stats-bar b{color:var(--black)}
.tabla-wrap{overflow-x:auto;padding:0 1.5rem 2rem}
table{width:100%;border-collapse:collapse;margin-top:1rem;font-size:13px}
thead th{
  font-family:var(--head);font-size:8px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dg);
  padding:10px 12px;text-align:left;border-bottom:2px solid var(--black);
  position:sticky;top:0;background:var(--white);z-index:5;white-space:nowrap;
}
tbody tr{border-bottom:1px solid #eee;transition:background .1s}
tbody tr:hover{background:var(--mg3)}
td{padding:9px 12px;vertical-align:middle}
td.codigo{font-family:monospace;font-size:11px;color:var(--dg);white-space:nowrap}
td.descripcion{max-width:320px;line-height:1.4}
td.precio{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.stock{text-align:center;font-weight:600}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10px;font-weight:500;padding:3px 9px;border-radius:12px;
  white-space:nowrap;cursor:pointer;transition:filter .15s;user-select:none;
}
.badge:hover{filter:brightness(0.9)}
.badge-marca{background:#E8F4FD;color:#1A6FA8}
.badge-tipo{background:#F0F7EE;color:#2D7A3A}
.badge-sin{background:#F5F5F5;color:#999}
.badge-editado{outline:2px solid var(--mg);outline-offset:1px}
.badge-pencil{font-size:9px;opacity:.6}
.stock-0{color:#C0392B;font-weight:700}
.stock-low{color:#E67E22;font-weight:700}
.stock-ok{color:#27AE60}
.popover{
  position:fixed;z-index:100;
  background:var(--white);border:2px solid var(--black);border-radius:10px;
  padding:14px 16px;width:270px;box-shadow:4px 4px 0 var(--black);
  display:none;
}
.popover.visible{display:block}
.popover-title{font-family:var(--head);font-size:9px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dg);margin-bottom:8px}
.popover-desc{font-size:11px;color:#444;margin-bottom:10px;
  border-left:3px solid var(--mg);padding-left:8px;line-height:1.4;
  max-height:50px;overflow:hidden}
.popover select{width:100%;margin-bottom:8px;font-size:13px}
.popover-custom{display:flex;gap:6px;margin-bottom:10px}
.popover-custom input{flex:1;font-size:12px;padding:6px 8px}
.popover-custom input::placeholder{color:#bbb}
.popover-btns{display:flex;gap:6px}
.pop-ok{flex:1;background:var(--mg);color:var(--white);border:none;
  border-radius:5px;padding:8px;font-family:var(--head);font-size:8px;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.pop-ok:hover{background:var(--mg2)}
.pop-cancel{background:var(--white);color:var(--black);border:2px solid #ddd;
  border-radius:5px;padding:8px 12px;font-family:var(--head);font-size:8px;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.pop-cancel:hover{border-color:var(--black)}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--black);color:var(--white);
  font-size:13px;padding:10px 20px;border-radius:8px;
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:200;white-space:nowrap;
}
.toast.show{opacity:1}
.empty{text-align:center;padding:4rem 2rem;color:var(--dg)}
@media(max-width:640px){
  .filtros{flex-direction:column}
  .f-group{min-width:100%}
  .f-actions{margin-left:0;width:100%;flex-direction:column}
  .btn{width:100%;text-align:center}
  table{font-size:12px}
  thead th{font-size:7px;padding:8px}
  td{padding:7px 8px}
  td.descripcion{max-width:140px}
  .popover{width:calc(100vw - 32px);left:16px!important}
}
</style>
</head>
<body>

<div class="top">
  <div class="top-logo"><b>PAT</b>Inventario Interno</div>
  <div class="top-right">
    <div class="top-badge">963 productos &middot; Inventario.XLS</div>
    <div class="autosave">
      <div class="autosave-dot" id="autosave-dot"></div>
      <span id="autosave-txt">Conectando...</span>
    </div>
  </div>
</div>

<div class="filtros">
  <div class="f-group">
    <label>Marca</label>
    <select id="sel-marca"><option value="">Todas las marcas</option></select>
  </div>
  <div class="f-group">
    <label>Tipo</label>
    <select id="sel-tipo"><option value="">Todos los tipos</option></select>
  </div>
  <div class="f-group">
    <label>Buscar</label>
    <input type="text" id="buscar" placeholder="Código o descripción…">
  </div>
  <div class="f-group">
    <label>Ordenar por</label>
    <select id="sel-orden">
      <option value="descripcion">Descripción A-Z</option>
      <option value="stock-asc">Stock ↑ (menor primero)</option>
      <option value="stock-desc">Stock ↓ (mayor primero)</option>
      <option value="precio-desc">Precio ↓</option>
      <option value="precio-asc">Precio ↑</option>
      <option value="marca">Marca A-Z</option>
      <option value="editados">Editados primero</option>
    </select>
  </div>
  <div class="f-actions">
    <button class="btn btn-out" onclick="limpiarFiltros()">Limpiar</button>
  </div>
</div>

<div class="stats-bar" id="stats-bar">Cargando…</div>

<div class="tabla-wrap">
  <table>
    <thead><tr>
      <th>Código</th>
      <th>Descripción</th>
      <th title="Haz clic en el badge para editar">Marca ✏</th>
      <th title="Haz clic en el badge para editar">Tipo ✏</th>
      <th onclick="ordenarPor('stock-asc')" style="cursor:pointer">Stock ↕</th>
      <th onclick="ordenarPor('precio-desc')" style="cursor:pointer">P. Venta ↕</th>
    </tr></thead>
    <tbody id="tabla-body"></tbody>
  </table>
  <div class="empty" id="empty-msg" style="display:none">
    <div style="font-size:2.5rem;margin-bottom:.75rem">🔍</div>
    <div>No hay productos con estos filtros.</div>
  </div>
</div>

<div class="popover" id="popover">
  <div class="popover-title" id="pop-title"></div>
  <div class="popover-desc" id="pop-desc"></div>
  <select id="pop-select"></select>
  <div class="popover-custom">
    <input type="text" id="pop-custom" placeholder="O escribe una nueva…">
  </div>
  <div class="popover-btns">
    <button class="pop-cancel" onclick="cerrarPopover()">Cancelar</button>
    <button class="pop-ok" onclick="confirmarEdicion()">Guardar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

n clasificar"}, {"codigo": "UNI-3", "descripcion": "VALVULA. ACC. RAP. RM 1/2", "precio_venta": 15.4, "stock": 2, "marca": "Sin marca", "tipo": "Sin clasificar"}, {"codigo": "WFS-1133", "descripcion": "LIJADORA DE AIRE WUFU 75MM WFS-1133", "precio_venta": 250.0, "stock": 5, "marca": "Sin marca", "tipo": "Lija / Abrasivo"}, {"codigo": "WFS-2131", "descripcion": "LIJADORA MINI NEUMATICA WUFU", "precio_venta": 225.0, "stock": 5, "marca": "Sin marca", "tipo": "Lija / Abrasivo"}];
const MARCAS_BASE = ["3M", "Airum", "Besa", "Bryll", "CRS", "Dismoer", "Felton", "Franchi & Kim", "Indasa", "Iwata / Sata", "Kenda", "Metabo", "Novol", "Sagola", "Sikkens", "Sin marca", "Vermaat"];
const TIPOS_BASE  = ["Adhesivo / Sellado", "Barniz", "Cinta / Enmascarado", "Compresor / Aire", "Disolvente / Catalizador", "Envase / Recipiente", "Fondo / Imprimacion", "Herramienta", "Lija / Abrasivo", "Lijadora / Pulidora", "Limpieza", "Mascarilla / EPI", "Masilla", "Pintura / Base", "Pistola / Aerografia", "Pulimento / Abrillantado", "Sin clasificar", "Spray"];

let correcciones = {};
let TODOS = [];

function claveProducto(p) {
  const c = (p.codigo || '').trim();
  if (c && c !== '—') return c;
  return 'desc_' + btoa(encodeURIComponent(p.descripcion.slice(0,60))).slice(0,20);
}

function aplicarCorreccionesADatos() {
  TODOS = TODOS_ORIG.map((p, i) => {
    const key = claveProducto(p);
    const c   = correcciones[key] || {};
    return { ...p, _idx: i, _key: key, marca: c.marca ?? p.marca, tipo: c.tipo ?? p.tipo };
  });
}

async function cargarCorrecciones() {
  setIndicador('cargando');
  try {
    const { data, error } = await sb.from(TABLA).select('codigo,marca,tipo');
    if (error) throw error;
    correcciones = {};
    (data || []).forEach(row => {
      correcciones[row.codigo] = { marca: row.marca, tipo: row.tipo };
    });
    localStorage.setItem(LS_KEY, JSON.stringify(correcciones));
    setIndicador('ok');
  } catch(err) {
    console.warn('Sin conexion con Supabase:', err.message);
    try { correcciones = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch(e) {}
    setIndicador('offline');
  }
  aplicarCorreccionesADatos();
  poblarSelects();
  aplicarFiltros();
}

async function guardarCorreccion(key, marca, tipo) {
  setIndicador('guardando');
  try {
    const { error } = await sb.from(TABLA).upsert(
      { codigo: key, marca, tipo, actualizado_at: new Date().toISOString() },
      { onConflict: 'codigo' }
    );
    if (error) throw error;
    localStorage.setItem(LS_KEY, JSON.stringify(correcciones));
    setIndicador('ok');
  } catch(err) {
    localStorage.setItem(LS_KEY, JSON.stringify(correcciones));
    setIndicador('offline');
    mostrarToast('Sin internet — guardado solo en este dispositivo');
  }
}

let indicadorEstado = 'ok';
function setIndicador(estado) {
  indicadorEstado = estado;
  const dot = document.getElementById('autosave-dot');
  const txt = document.getElementById('autosave-txt');
  const n   = Object.keys(correcciones).length;
  dot.className = 'autosave-dot';
  dot.style.background = '';
  dot.style.boxShadow  = '';
  if (estado === 'cargando' || estado === 'guardando') {
    dot.classList.add('saving');
    txt.textContent = estado === 'cargando' ? 'Cargando...' : 'Guardando...';
  } else if (estado === 'ok') {
    dot.style.background = '#4CAF50';
    dot.style.boxShadow  = '0 0 6px rgba(76,175,80,0.8)';
    txt.textContent = n > 0
      ? n + ' cambio' + (n===1?'':'s') + ' guardado' + (n===1?'':'s')
      : 'Sincronizado';
  } else {
    dot.classList.add('offline');
    txt.textContent = 'Sin conexión — guardado local';
  }
}

function todasMarcas() {
  return [...new Set([...MARCAS_BASE, ...TODOS.map(p=>p.marca)])].sort();
}
function todosTipos() {
  return [...new Set([...TIPOS_BASE, ...TODOS.map(p=>p.tipo)])].sort();
}

const selMarca = document.getElementById('sel-marca');
const selTipo  = document.getElementById('sel-tipo');

function poblarSelects() {
  const mAct = selMarca.value, tAct = selTipo.value;
  selMarca.innerHTML = '<option value="">Todas las marcas</option>';
  selTipo.innerHTML  = '<option value="">Todos los tipos</option>';
  todasMarcas().forEach(m => {
    const o = document.createElement('option');
    o.value = m; o.textContent = m;
    if (m === mAct) o.selected = true;
    selMarca.appendChild(o);
  });
  todosTipos().forEach(t => {
    const o = document.createElement('option');
    o.value = t; o.textContent = t;
    if (t === tAct) o.selected = true;
    selTipo.appendChild(o);
  });
}

let ordenActual = 'descripcion';

function ordenarPor(ord) {
  document.getElementById('sel-orden').value = ord;
  ordenActual = ord;
  aplicarFiltros();
}

function limpiarFiltros() {
  selMarca.value = ''; selTipo.value = '';
  document.getElementById('buscar').value = '';
  document.getElementById('sel-orden').value = 'descripcion';
  ordenActual = 'descripcion';
  aplicarFiltros();
}

function aplicarFiltros() {
  const marca = selMarca.value;
  const tipo  = selTipo.value;
  const busq  = document.getElementById('buscar').value.toLowerCase().trim();
  ordenActual = document.getElementById('sel-orden').value;

  let lista = TODOS.filter(p => {
    if (marca && p.marca !== marca) return false;
    if (tipo  && p.tipo  !== tipo)  return false;
    if (busq && !(p.descripcion+' '+p.codigo).toLowerCase().includes(busq)) return false;
    return true;
  });

  lista.sort((a, b) => {
    const aE = !!correcciones[a._key], bE = !!correcciones[b._key];
    switch(ordenActual) {
      case 'stock-asc':   return a.stock - b.stock;
      case 'stock-desc':  return b.stock - a.stock;
      case 'precio-desc': return b.precio_venta - a.precio_venta;
      case 'precio-asc':  return a.precio_venta - b.precio_venta;
      case 'marca':       return a.marca.localeCompare(b.marca);
      case 'editados':    return (bE-aE)||a.descripcion.localeCompare(b.descripcion);
      default:            return a.descripcion.localeCompare(b.descripcion);
    }
  });

  renderTabla(lista);
  actualizarStats(lista, marca, tipo);
}

function stockClass(s) { return s===0?'stock-0':s<=2?'stock-low':'stock-ok'; }
function badgeClass(val, campo) {
  if (val==='Sin marca'||val==='Sin clasificar') return 'badge-sin';
  return campo==='marca'?'badge-marca':'badge-tipo';
}

function renderTabla(lista) {
  const body  = document.getElementById('tabla-body');
  const empty = document.getElementById('empty-msg');
  if (!lista.length) { body.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display = 'none';
  body.innerHTML = lista.map(p => {
    const precioStr = p.precio_venta > 0
      ? p.precio_venta.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'
      : '—';
    const corr  = correcciones[p._key] || {};
    const mEdit = !!corr.marca, tEdit = !!corr.tipo;
    const lapiz = '<span class="badge-pencil">✏</span>';
    const bMarca = `<span class="badge ${badgeClass(p.marca,'marca')}${mEdit?' badge-editado':''}"
      onclick="abrirPopover(event,${p._idx},'marca')" title="Clic para cambiar la marca">
      ${p.marca} ${mEdit?lapiz:''}</span>`;
    const bTipo = `<span class="badge ${badgeClass(p.tipo,'tipo')}${tEdit?' badge-editado':''}"
      onclick="abrirPopover(event,${p._idx},'tipo')" title="Clic para cambiar el tipo">
      ${p.tipo} ${tEdit?lapiz:''}</span>`;
    return `<tr>
      <td class="codigo">${p.codigo||'—'}</td>
      <td class="descripcion">${p.descripcion}</td>
      <td>${bMarca}</td>
      <td>${bTipo}</td>
      <td class="stock"><span class="${stockClass(p.stock)}">${p.stock}</span></td>
      <td class="precio">${precioStr}</td>
    </tr>`;
  }).join('');
}

function actualizarStats(lista, marca, tipo) {
  const sinStock  = lista.filter(p=>p.stock===0).length;
  const stockBajo = lista.filter(p=>p.stock>0&&p.stock<=2).length;
  const nEdit     = Object.keys(correcciones).length;
  document.getElementById('stats-bar').innerHTML = `
    Mostrando <b>${lista.length}</b> de <b>963</b> productos
    &nbsp;&middot;&nbsp; Sin stock: <b style="color:#C0392B">${sinStock}</b>
    &nbsp;&middot;&nbsp; Stock bajo (&le;2): <b style="color:#E67E22">${stockBajo}</b>
    ${nEdit>0?`&nbsp;&middot;&nbsp; Editados: <b style="color:var(--mg)">${nEdit}</b>`:''}
    ${marca?`&nbsp;&middot;&nbsp; Marca: <b>${marca}</b>`:''}
    ${tipo ?`&nbsp;&middot;&nbsp; Tipo: <b>${tipo}</b>` :''}
  `;
}

let popIdx = null, popCampo = null;

function abrirPopover(e, idx, campo) {
  e.stopPropagation();
  popIdx = idx; popCampo = campo;
  const p = TODOS[idx];
  const pop = document.getElementById('popover');
  document.getElementById('pop-title').textContent =
    campo==='marca' ? 'Cambiar marca' : 'Cambiar tipo';
  document.getElementById('pop-desc').textContent = p.descripcion;
  document.getElementById('pop-custom').value = '';
  const sel = document.getElementById('pop-select');
  sel.innerHTML = '';
  (campo==='marca' ? todasMarcas() : todosTipos()).forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    if (v === p[campo]) o.selected = true;
    sel.appendChild(o);
  });
  const margin=12, pw=270, ph=230;
  let top=e.clientY+margin, left=e.clientX-10;
  if (left+pw > window.innerWidth-margin)  left = window.innerWidth-pw-margin;
  if (top+ph  > window.innerHeight-margin) top  = e.clientY-ph-margin;
  pop.style.top=top+'px'; pop.style.left=left+'px';
  pop.classList.add('visible');
  document.getElementById('pop-custom').focus();
}

function cerrarPopover() {
  document.getElementById('popover').classList.remove('visible');
  popIdx = null; popCampo = null;
}

async function confirmarEdicion() {
  if (popIdx === null) return;
  const custom   = document.getElementById('pop-custom').value.trim();
  const nuevoVal = custom || document.getElementById('pop-select').value;
  const p   = TODOS[popIdx];
  const key = p._key;

  if (!correcciones[key]) correcciones[key] = {};
  correcciones[key][popCampo] = nuevoVal;
  TODOS[popIdx][popCampo] = nuevoVal;

  poblarSelects();
  aplicarFiltros();
  cerrarPopover();
  mostrarToast('Guardado: "' + nuevoVal + '"');

  await guardarCorreccion(key, correcciones[key].marca ?? null, correcciones[key].tipo ?? null);
}

document.addEventListener('click', e => {
  const pop = document.getElementById('popover');
  if (pop.classList.contains('visible') && !pop.contains(e.target)) cerrarPopover();
});
document.getElementById('pop-custom').addEventListener('keydown', e => {
  if (e.key==='Enter') confirmarEdicion();
  if (e.key==='Escape') cerrarPopover();
});

let toastT;
function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove('show'), 2500);
}

selMarca.addEventListener('change', aplicarFiltros);
selTipo.addEventListener('change', aplicarFiltros);
document.getElementById('sel-orden').addEventListener('change', aplicarFiltros);
let debT;
document.getElementById('buscar').addEventListener('input', ()=>{
  clearTimeout(debT); debT=setTimeout(aplicarFiltros,200);
});

cargarCorrecciones();
</script>
